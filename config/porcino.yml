# config/porcino.yml
# Parametri di idoneita' ambientale per il porcino (Boletus edulis sensu lato:
# B. edulis, B. aereus, B. pinophilus, B. reticulatus, trattati insieme perche'
# in Italia si raccolgono e si segnalano indistintamente come "porcino").
#
# Questi numeri NON sono stimati da dati: sono una prima parametrizzazione
# basata sulla letteratura micologica e sulle fasce vegetazionali italiane.
# Verranno rivisti confrontandoli con le osservazioni GBIF e iNaturalist.
# Ogni modifica qui cambia la mappa senza toccare una riga di codice.

nome: porcino
nome_scientifico: Boletus edulis s.l.

# --- Filtri di attivazione della cella ---------------------------------------
# Una cella entra nel calcolo giornaliero solo se supera entrambe le soglie.
soglie:
  bosco_frac_min: 0.10        # almeno il 10% della cella a bosco (~900 ettari)
  idoneita_ospite_min: 0.12   # almeno una porzione di bosco compatibile

# --- Qualita' del bosco per classe Corine ------------------------------------
# Quanto una tipologia di copertura e' un buon ospite micorrizico.
# Corine non distingue le specie arboree: 311 comprende faggio, castagno e
# querce, tutti ottimi ospiti, e per questo prende 1.0. Le conifere prendono
# meno non perche' il porcino non ci cresca (B. pinophilus e' legato ai pini)
# ma perche' la classe include anche rimboschimenti giovani e improduttivi.
peso_clc:
  clc_311_latifoglie: 1.00
  clc_313_misto: 0.95
  clc_312_conifere: 0.75

# --- Fasce altimetriche per macroregione -------------------------------------
# Il porcino segue le fasce vegetazionali, che si abbassano scendendo di
# latitudine: la faggeta sta a 1200-1600 m sulle Alpi, a 900-1500 sull'Appennino
# centrale, e in Sicilia sopravvive solo in poche stazioni relitte sopra i 1200.
#
# I pesi si applicano alle frazioni di cella in ciascuna fascia (calcolate dal
# DEM), quindi una cella che va da 300 a 1500 m riceve credito parziale per la
# parte buona invece di essere valutata sulla sola quota media.
#
# Ordine delle fasce, in metri:
#   0-300, 300-600, 600-900, 900-1200, 1200-1600, 1600-2000, oltre 2000
peso_quota:
  alpino:        [0.15, 0.35, 0.70, 1.00, 1.00, 0.55, 0.05]
  prealpino:     [0.25, 0.65, 0.95, 1.00, 0.90, 0.40, 0.02]
  appenninico:   [0.25, 0.60, 0.95, 1.00, 0.85, 0.30, 0.02]
  mediterraneo:  [0.55, 0.85, 0.90, 0.60, 0.25, 0.05, 0.00]

# --- Assegnazione della macroregione -----------------------------------------
# Regola grossolana ma trasparente, basata su latitudine e quota media.
# Serve solo a scegliere quale profilo altimetrico applicare.
macroregione:
  lat_nord: 44.5          # sopra questa latitudine siamo in ambito alpino
  quota_montana: 600      # sopra questa quota media la cella e' "di montagna"


# =============================================================================
# PARAMETRI DEL MODELLO
# =============================================================================
# Tutto quello che sta qui sotto e' tarabile senza toccare il codice.
modello:

  # --- Evento trigger di pioggia ---------------------------------------------
  # Una buttata parte da una pioggia abbondante concentrata. Cerchiamo, nella
  # finestra di latenza, il giorno in cui la pioggia cumulata delle 72 ore
  # precedenti ha superato la soglia.
  trigger:
    finestra_ore: 72
    soglia_mm: 25.0
    # Quanto conta l'abbondanza: a 25 mm il trigger vale 0.35, a 70 mm vale 1.0.
    # Oltre non aumenta: piogge torrenziali non moltiplicano la buttata, e sopra
    # una certa soglia dilavano il suolo invece di inzupparlo.
    mm_saturazione: 70.0
    peso_minimo: 0.35

  # --- Latenza fra pioggia e fruttificazione ---------------------------------
  # Campana asimmetrica centrata sul giorno 14, tagliata fuori da 8 e 25.
  # sigma 4.0 significa che al giorno 8 il peso e' 0.32 e al giorno 25 e' 0.02.
  latenza:
    giorni_min: 8
    giorni_max: 25
    giorni_picco: 14
    sigma: 4.0

  # --- Umidita' antecedente al trigger ---------------------------------------
  # Su suolo arido la pioggia scorre via e non ricarica il profilo profondo.
  # Guardiamo l'umidita' a 9-27 cm nei 10 giorni PRIMA del trigger.
  umidita_antecedente:
    giorni: 10
    secco: 0.10        # sotto questo valore il trigger vale poco
    saturo: 0.25       # sopra questo valore il trigger vale pieno
    peso_minimo: 0.40

  # --- Finestra termica del suolo --------------------------------------------
  # Trapezio: nullo sotto 8, pieno fra 12 e 18, di nuovo nullo sopra 23.
  # La rampa evita il gradino che un intervallo netto produrrebbe: un bosco a
  # 18.5 gradi non e' equivalente a uno a 30.
  # Media sui giorni immediatamente precedenti, quando si formano i primordi.
  termica:
    giorni_finestra: 7
    t_zero_basso: 8.0
    t_pieno_basso: 12.0
    t_pieno_alto: 18.0
    t_zero_alto: 23.0
    peso_6cm: 0.6      # il livello superficiale conta piu' del profondo
    peso_18cm: 0.4

  # --- Umidita' corrente del suolo -------------------------------------------
  # Il carpoforo e' fatto d'acqua: senza umidita' superficiale non si espande.
  umidita_corrente:
    giorni: 3
    secco: 0.12
    saturo: 0.25
    peso_minimo: 0.15

  # --- Gelo -------------------------------------------------------------------
  # Una gelata chiude la stagione in quella cella.
  gelo:
    giorni: 5
    soglia_c: -2.0
    penalita: 0.15     # moltiplicatore residuo, non azzeramento totale

  # --- Esposizione ------------------------------------------------------------
  # Con suolo caldo i versanti nord trattengono umidita' e vanno meglio; con
  # suolo freddo vale il contrario. Effetto piccolo: su celle da 9 km la
  # northness media e' quasi sempre vicina a zero.
  esposizione:
    ampiezza: 0.12
    t_neutra: 15.5     # temperatura attorno a cui l'effetto cambia segno

  # --- Correzione per quota nelle sotto-celle ---------------------------------
  # Il meteo arriva dalla cella genitore da 9 km. Dentro quei 9 km la quota puo'
  # variare di oltre mille metri, e la temperatura del suolo con essa. Correggiamo
  # applicando un gradiente verticale alla differenza fra la quota della
  # sotto-cella e quella media del genitore.
  #
  # In aria libera il gradiente e' circa 0.65 gradi ogni 100 m. Nel suolo e'
  # attenuato, e tanto piu' in profondita': l'inerzia termica smorza le
  # variazioni. I valori qui sotto sono una prima stima da tarare col backtest.
  #
  # Pioggia e umidita' NON vengono corrette: non abbiamo un modo difendibile per
  # ridistribuirle dentro la cella, e inventarlo darebbe precisione finta.
  downscaling:
    gradiente_6cm: 0.55      # gradi ogni 100 metri
    gradiente_18cm: 0.45
    delta_max: 900           # oltre questo dislivello dal genitore non correggiamo

  # --- Orizzonte di previsione ------------------------------------------------
  # Quanti giorni futuri calcolare. Nota: per un giorno futuro entro +8 la
  # pioggia trigger e' gia' avvenuta, quindi non e' una previsione meteo ma un
  # conto su dati osservati. Solo temperatura e umidita' vengono dal forecast.
  giorni_previsti: 7
